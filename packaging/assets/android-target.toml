# APIaxess GUI Android target — downloadable add-on manifest (Phase D1).
#
# This is the OPTIONAL, separately-versioned add-on that gives a user a reliable,
# GUI-drivable Android target: a slim, no-GApps, root-capable AOSP x86_64 emulator
# the user installs their own APK into and drives by hand (completing logins and
# onboarding the autonomous crawler cannot), with traffic flowing to the workbench.
# It is NOT part of the ~400 MB base install; it is pulled only when a user wants a
# GUI Android target — the same out-of-band, path-resolved model as the
# analysis-runtime payload ([[analysis-runtime.toml]]). The base install works
# without it. It carries its own version, SBOM, notices, and provenance.
#
# It differs from the analysis runtime on purpose:
#   * analysis-runtime  — headless, disposable, autonomous-crawler target; boot
#                         provisioning is baked into a baseline snapshot.
#   * android-target    — a slim GUI target the user drives; provisioning is NOT
#                         baked. It is applied on FIRST BOOT by the existing C2/C5
#                         flow (adb detect -> system-CA install -> frida-server ->
#                         client APK + pairing), keeping the image generic and
#                         low-maintenance. State persists across boots so a login
#                         the user completes once survives.
#
# Slim + root-capable: a pure-AOSP `default` x86_64 system image is userdebug (so
# `adb root` works) and carries NO Google Play / GMS / Widevine (proprietary, not
# redistributable) and no launcher bloat to strip — the user installs one APK and
# traverses. Acquisition is via Google's `sdkmanager`, which verifies each package
# against Google's signed repository manifest; the client APK + device-side
# frida-server are staged from this repo's own build artifacts.
#
# Licensing/provenance (see android-target-NOTICES.md): AOSP userspace is
# Apache-2.0; the Linux kernel in the image is GPL-2.0; QEMU (the emulator engine)
# is GPL-2.0 (shipped unmodified); the bundled frida-server is wxWindows-licensed;
# the APIaxess client APK is first-party. No-GApps — all redistributable.
schema_version = 1
product = "APIaxess GUI Android target"
addon_id = "android-target"
payload_version = "1.0.0-android13"
android_api_level = 33
android_release = "13"
image_variant = "default"                 # pure AOSP; NOT google_apis / playstore
owned_avd_name = "apiaxess-android-target"

# Android command-line tools bootstrap (provides sdkmanager/avdmanager).
[cmdline_tools]
build = "13114758"
[cmdline_tools.windows_x64]
url = "https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip"
[cmdline_tools.linux_x64]
url = "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"

# SDK packages installed via sdkmanager (checksums verified by sdkmanager against
# Google's signed repository manifest). Reuses the same emulator engine +
# platform-tools components as the analysis runtime, so the resolver layout and
# tool versions match; the add-on is self-contained so a base install without the
# analysis runtime still boots this target.
[sdk_packages]
emulator = "emulator"                     # bundled QEMU-based emulator engine
platform_tools = "platform-tools"         # adb
system_image = "system-images;android-33;default;x86_64"

# First-boot provisioning: applied by the engine via the existing C2/C5 flow, NOT
# baked into a snapshot. The add-on ships the client APK + device-side frida-server
# as artifacts; the session CA installed on first boot is the live per-session CA
# (fetched + fingerprint-pinned through pairing), NOT a shipped static cert — that
# is the intended, safer trust model.
[provisioning]
install_client_apk = true
install_session_ca = true
install_frida_server = true
# Install-relative payload root; the engine resolves this as ANDROID_SDK_ROOT and
# via the APIAXESS_ANDROID_TARGET override.
install_path = "android-target"

# Headless boot profile (Phase D1) + the ws-scrcpy port D2 will stream over.
[runtime]
# ~1.5-2 GB RAM floor; acceleration is chosen per host (WHPX/KVM) with an honest
# software-mode fallback when nested virtualization is unavailable.
ram_mib = 2048
# Streamed to the operator by ws-scrcpy behind the engine's auth in Phase D2.
ws_scrcpy_port = 8000

# Repo-relative build artifacts staged into the add-on payload by the fetch script.
[artifacts]
client_apk = "apps/android/artifacts/apiaxess-client-0.1.0-debug.apk"

# Screen streaming (Phase D2): a pinned ws-scrcpy (MIT) on a bundled Node runtime,
# staged into the add-on. ws-scrcpy has NO built-in auth; the engine reverse-proxies
# it behind the workbench origin-guard + session/device token and connects to it on
# loopback. ws-scrcpy is run with WS_SCRCPY_PATHNAME=`base_path` so its own asset,
# deep-link, and WebSocket URLs stay same-origin UNDER the engine proxy's prefix
# (and carry the stream cookie), and in "proxy over adb" interface mode (the
# emulator quirk: scrcpy-server listens on the AVD's internal interface). Assembly
# (Node + `npm run dist`) runs in the release pipeline; a payload assembled without
# it still boots and captures traffic (the engine reports sandbox.android-stream-
# unavailable). The pinned revision MUST support WS_SCRCPY_PATHNAME (see below).
[streaming]
# The base path the engine reverse-proxies the view under and the fork serves from.
base_path = "/android-stream/"
# Payload-relative layout the fetch script stages into and the engine reads.
node_dir = "node"
ws_scrcpy_dir = "ws-scrcpy"
ws_scrcpy_entry = "dist/index.js"

# Pinned Node runtime (unmodified OpenJS builds from nodejs.org; SHA-256 from the
# release SHASUMS256.txt). ws-scrcpy runs on this — no host Node required.
[streaming.node]
version = "20.17.0"
[streaming.node.windows_x64]
url = "https://nodejs.org/dist/v20.17.0/node-v20.17.0-win-x64.zip"
[streaming.node.linux_x64]
url = "https://nodejs.org/dist/v20.17.0/node-v20.17.0-linux-x64.tar.xz"

# Pinned ws-scrcpy (MIT), by commit SHA so the build is reproducible. Attribution
# is in android-target-NOTICES.md.
#
# Base-path routing is mandatory here: the engine reverse-proxies ws-scrcpy under
# `base_path` and sets WS_SCRCPY_PATHNAME (plus WS_SCRCPY_HOST/PORT) at runtime so
# ws-scrcpy's own asset, deep-link, and WebSocket URLs stay same-origin UNDER the
# `/android-stream/` prefix (and so carry the stream cookie/token). The tagged
# release v0.8.1 PREDATES WS_SCRCPY_PATHNAME (upstream added it after v0.8.1, on
# master), so pinning v0.8.1 built an unprefixed ws-scrcpy: the embedded iframe
# then showed the Device Tracker and its player/decoder deep-links resolved at the
# GUI root without the prefix or token — the D4 streaming regression. The pin is
# therefore a post-WS_SCRCPY_PATHNAME master commit. There is no separate fork;
# the base-path support is upstream. (A fresh assembly on a build host + emulator
# is still required to verify the live stream end-to-end.)
[streaming.ws_scrcpy]
repo = "https://github.com/NetrisTV/ws-scrcpy"
# master @ 2026-08-24 — supports the WS_SCRCPY_PATHNAME base-path routing the engine
# relies on (documented under upstream "Run configuration"), unlike v0.8.1.
git_ref = "8855ad1184ec7b41f1b28d1b899856f828e09c3e"
