syntax = "proto3";

package apiaxess.plugin.instrumentation_orchestrator.v1;

import "apiaxess/plugin/v1/common.proto";
import "apiaxess/plugin/v1/evolution.proto";

option java_multiple_files = true;
option java_package = "dev.apiaxess.plugin.instrumentation_orchestrator.v1";

// Logical interface ID: apiaxess.instrumentation-orchestrator, version 1.0.
message DescribeActionsRequest {
  option (apiaxess.plugin.v1.message_evolution) = { since: { major: 1 minor: 0 } };
}

message InstrumentationAction {
  option (apiaxess.plugin.v1.message_evolution) = { since: { major: 1 minor: 0 } };
  string action_id = 1;
  string display_name = 2;
  repeated string required_capability_ids = 3;
  repeated string required_host_capability_ids = 4;
}

message SubstrateHealth {
  option (apiaxess.plugin.v1.message_evolution) = { since: { major: 1 minor: 0 } };
  bool server_ipc = 1;
  bool target_process = 2;
  bool class_loader = 3;
  bool dex_resolution = 4;
  bool script_ready = 5;
  string crash_evidence = 6;
  string substrate_version = 7;
}

message DescribeActionsResponse {
  option (apiaxess.plugin.v1.message_evolution) = { since: { major: 1 minor: 0 } };
  repeated InstrumentationAction actions = 1;
}

message ExecuteRequest {
  option (apiaxess.plugin.v1.message_evolution) = { since: { major: 1 minor: 0 } };
  apiaxess.plugin.v1.OperationContext context = 1;
  apiaxess.plugin.v1.SandboxLeaseRef sandbox = 2;
  string action_id = 3;
  repeated apiaxess.plugin.v1.ArtifactRef inputs = 4;
  map<string, string> parameters = 5;
}

message ExecuteResponse {
  option (apiaxess.plugin.v1.message_evolution) = { since: { major: 1 minor: 0 } };
  repeated apiaxess.plugin.v1.ArtifactRef outputs = 1;
  repeated apiaxess.plugin.v1.Diagnostic diagnostics = 2;
  bool partial = 3;
  SubstrateHealth health = 4;
  string stealth_bundle_id = 5;
  string stealth_bundle_version = 6;
}

service InstrumentationOrchestratorService {
  option (apiaxess.plugin.v1.service_evolution) = { since: { major: 1 minor: 0 } };
  rpc DescribeActions(DescribeActionsRequest) returns (DescribeActionsResponse) {
    option (apiaxess.plugin.v1.method_evolution) = { since: { major: 1 minor: 0 } };
  }
  rpc Execute(ExecuteRequest) returns (ExecuteResponse) {
    option (apiaxess.plugin.v1.method_evolution) = { since: { major: 1 minor: 0 } };
  }
}
