[package]
name = "apiaxess-protection-detector"
description = "Clean-room, permissively licensed Android protection detector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
apiaxess-artifact-intake = { path = "../artifact-intake" }
apiaxess-diagnostics = { path = "../diagnostics" }
# Single-pass, case-insensitive multi-pattern search for the protection marker
# scan: one automaton pass per document replaces dozens of per-needle `.contains`
# passes over the (large) decompressed corpus. Already in the workspace lock via
# `regex`.
aho-corasick = "1.1"
serde.workspace = true
zip = "2.2.2"

[dev-dependencies]
apiaxess-test-fixtures = { path = "../test-fixtures" }

[lints]
workspace = true
