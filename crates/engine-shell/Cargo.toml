[package]
name = "apiaxess-engine-shell"
description = "Core APIaxess orchestration shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
apiaxess-api-model = { path = "../api-model" }
apiaxess-app-crawler = { path = "../app-crawler" }
apiaxess-artifact-intake = { path = "../artifact-intake" }
apiaxess-collections-emitter = { path = "../collections-emitter" }
apiaxess-confidence = { path = "../confidence" }
apiaxess-dynamic-capture = { path = "../dynamic-capture" }
apiaxess-diagnostics = { path = "../diagnostics" }
apiaxess-external-tools = { path = "../external-tools" }
apiaxess-fusion = { path = "../fusion" }
apiaxess-network-extraction = { path = "../network-extraction" }
apiaxess-network-routing = { path = "../network-routing" }
apiaxess-openapi-emitter = { path = "../openapi-emitter" }
apiaxess-plugin-host = { path = "../plugin-host" }
apiaxess-python-sdk-emitter = { path = "../python-sdk-emitter" }
apiaxess-sandbox = { path = "../sandbox" }
apiaxess-session = { path = "../session" }
apiaxess-static-pass = { path = "../static-pass" }
apiaxess-target-apk = { path = "../../plugins/targets/apk" }
apiaxess-unified-surface = { path = "../unified-surface" }
apiaxess-workbench-proxy = { path = "../workbench-proxy" }
apiaxess-workbench-store = { path = "../workbench-store" }
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tungstenite.workspace = true
process-wrap.workspace = true

[dev-dependencies]
apiaxess-host-capabilities = { path = "../host-capabilities" }

[features]
# Forwards the linked-frida-core build to the sandbox crate for the packaging
# variant. Off by default so the standard build needs no Frida devkit.
frida-embedded = ["apiaxess-sandbox/frida-embedded"]

[lints]
workspace = true
