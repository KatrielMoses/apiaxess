[package]
name = "apiaxess-external-tools"
description = "Exclusive boundary for external tool discovery and execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
process-wrap.workspace = true
thiserror.workspace = true

# Windows-only: CREATE_NO_WINDOW so spawned console-subsystem children (the engine
# under the GUI shell, and java/apktool/jadx/ffuf during intake) never pop a
# visible terminal window. Already in the workspace lock via process-wrap.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

# Unix-only: killpg, so stopping a tool also reaps its grandchildren (e.g. qemu
# under the emulator launcher). Already in the workspace lock via the sandbox.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[lints]
workspace = true
