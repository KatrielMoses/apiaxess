<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- The identity-kit mark at a 32px-safe weight: strokes thickened to 20 units
       so it survives a tab-strip render. The mark is FOUR strokes and all four
       are required (source of truth: apps/gui/src/brand/logo.ts markSvg):
         1. the ink chevron bracket,
         2. the accent shaft,
         3. the accent arrowhead  (the "<", wings left of the tip),
         4. the ink arrowhead     (the ">", wings right of the tip).
       Strokes 3 and 4 cross at the shared tip to form the "x" of "apiaxess";
       dropping the ink arrowhead (as an earlier favicon did) leaves the x
       half-drawn. The kit's reversed lockup swaps Ink for Paper on a dark
       ground, which the media query does so a dark tab strip gets white ink. -->
  <style>
    .ink { stroke: #0D0D0D; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #FFFFFF; }
    }
  </style>
  <path class="ink" d="M134 58 L100 24 L24 100 L100 176 L134 142" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 100 H140" stroke="#2D7FF9" stroke-width="20" stroke-linecap="round"/>
  <path d="M116 76 L144 100 L116 124" stroke="#2D7FF9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M174 76 L144 100 L174 124" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
