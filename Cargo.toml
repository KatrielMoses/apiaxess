[workspace]
members = [
    "apps/desktop",
    "apps/engine",
    "crates/api-model",
    "crates/app-crawler",
    "crates/artifact-intake",
    "crates/diagnostics",
    "crates/engine-shell",
    "crates/external-tools",
    "crates/host-capabilities",
    "crates/local-api",
    "crates/native-dialog",
    "crates/network-routing",
    "crates/network-extraction",
    "crates/static-pass",
    "crates/dynamic-capture",
    "crates/fusion",
    "crates/confidence",
    "crates/unified-surface",
    "crates/openapi-emitter",
    "crates/python-sdk-emitter",
    "crates/collections-emitter",
    "crates/crypto-capture",
    "crates/crypto-scheme-detection",
    "crates/crypto-canonicalization",
    "crates/crypto-signer-ir",
    "crates/protection-detector",
    "crates/plugin-host",
    "crates/sandbox",
    "crates/session",
    "crates/test-fixtures",
    "crates/workbench-proxy",
    "crates/workbench-store",
    "plugins/targets/apk",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
h2 = "0.4.16"
futures-util = "0.3.31"
getrandom = "0.3.4"
http-body-util = "0.1.3"
httparse = "1.10.1"
http = "1.3.1"
hyper-rustls = "0.27.9"
hudsucker = { version = "0.25.0", features = ["http2", "rcgen-ca", "rustls-client"] }
md-5 = "0.10.6"
rcgen = { version = "0.14.9", features = ["pem"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "http2"] }
regex = "1.11.1"
rustls = "0.23.43"
rustls-pki-types = "1.15.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_ignored = "0.1.10"
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.6.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full", "visit"] }
tokio-rustls = "0.26.4"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "job-object", "process-group", "creation-flags"] }
tungstenite = "0.30.0"
webpki-roots = "1.0.3"
x509-parser = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
